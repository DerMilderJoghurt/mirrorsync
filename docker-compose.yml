# MirrorSync – Docker Compose
#
# The ready-made image comes from the GitHub Container Registry, nothing needs to be built.
# This file is all you need, e.g. directly as a stack in Portainer.
#
# Start:   docker compose up -d
# Update:  docker compose pull && docker compose up -d

services:
  mirrorsync:
    image: ghcr.io/dermilderjoghurt/mirrorsync:latest   # or a fixed version, e.g. :1.44.0
    # Build it yourself instead of pulling (Dockerfile and app/ in the same folder):
    # build: .
    container_name: mirrorsync
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      # No user/password needed here: you create the admin when you first open the web GUI.
      # - SETUP_TOKEN=true   # optional: require a setup code (then shown by: docker logs mirrorsync),
      #                       useful if the container is reachable from the internet before the setup
      # - PUBLIC_URL=https://sync.example.com   # optional, address for passkeys (can also be set in the GUI)
      # Emergency, if you locked yourself out (comment out again afterwards):
      # - WEB_USER=admin
      # - WEB_PASS=new-password
      # - ADMIN_RESET=true      # resets password + 2FA of WEB_USER to WEB_PASS
      # - IPGUARD_RESET=true    # removes all IP and country blocks
      - PORT=8080               # port of the web GUI inside the container
    volumes:
      - ./config:/config        # jobs, storage locations, notifications, SSH keys
      - ./logs:/logs
      # Optional: self-update from the web GUI (see README). Gives MirrorSync full control over Docker on this host!
      # - /var/run/docker.sock:/var/run/docker.sock
      # Only needed if folders of THIS Docker host should be mirrored too:
      # - /srv/data:/data/data:ro
    ports:
      - "8080:8080"             # host port 8080 -> PORT in the container (left number is up to you)
