# MirrorSync – Docker Compose
#
# Das fertige Image kommt aus der GitHub Container Registry, nichts muss gebaut werden.
# Diese Datei allein reicht, z. B. auch direkt als Stack in Portainer.
#
# Starten:      docker compose up -d
# Aktualisieren: docker compose pull && docker compose up -d

services:
  mirrorsync:
    image: ghcr.io/dermilderjoghurt/mirrorsync:latest   # oder feste Version, z. B. :1.33.1
    # Selbst bauen statt herunterladen (Dockerfile und app/ im selben Ordner):
    # build: .
    container_name: mirrorsync
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      # Kein Benutzer/Passwort hier noetig: Beim ersten Aufruf der Web-GUI legst du den Admin an.
      # Den Einrichtungs-Code dafuer zeigt:  docker logs mirrorsync
      # - PUBLIC_URL=https://sync.example.de   # optional, Adresse fuer Passkeys (sonst in der GUI einstellbar)
      # Notfall, falls du dich ausgesperrt hast (danach wieder auskommentieren):
      # - WEB_USER=admin
      # - WEB_PASS=neues-passwort
      # - ADMIN_RESET=true      # setzt Passwort+2FA von WEB_USER auf WEB_PASS zurueck
      # - IPGUARD_RESET=true    # Notfall: entfernt alle IP- und Ländersperren,
      #                         # danach wieder auskommentieren
      - PORT=8080               # Port der Web-GUI im Container
    volumes:
      - ./config:/config        # Aufgaben, Speicherorte, Benachrichtigungen, SSH-Schluessel
      - ./logs:/logs
      # Nur noetig, wenn auch Ordner DIESES Docker-Hosts gespiegelt werden sollen:
      # - /srv/daten:/data/daten:ro

    ports:
      - "8080:8080"             # Host-Port 8080 -> PORT im Container (linke Zahl frei waehlbar)
