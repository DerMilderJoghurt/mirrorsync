name: Image und Release

# Baut das Image und legt es in der GitHub Container Registry ab:
#   ghcr.io/dermilderjoghurt/mirrorsync:latest       (jeder Push auf main)
#   ghcr.io/dermilderjoghurt/mirrorsync:<version>    (Version aus app/VERSION, z. B. 1.33.1)
#   ghcr.io/dermilderjoghurt/mirrorsync:1.33         (Minor-Version, immer die neueste 1.33.x)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # Tag und Release anlegen
  packages: write   # Image nach ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus app/VERSION lesen
        id: ver
        run: |
          v=$(tr -d ' \n\r' < app/VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dermilderjoghurt/mirrorsync
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.minor }}
          labels: |
            org.opencontainers.image.title=MirrorSync
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Legt bei neuer Version in app/VERSION automatisch Tag vX.Y.Z und ein GitHub-Release an
  # (Text aus dem passenden CHANGELOG-Abschnitt, ZIP des Repos als Anhang).
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release anlegen oder Text aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(tr -d ' \n\r' < app/VERSION)
          # CHANGELOG-Abschnitt "## <Version> – Datum" bis zur naechsten "## "-Zeile
          awk -v v="$V" '
            /^## / { if (p) exit; if (index($0, "## " v " ") == 1) { p = 1; next } }
            p' CHANGELOG.md > notes.md
          {
            echo
            echo "### Docker"
            echo '```'
            echo "docker pull ghcr.io/dermilderjoghurt/mirrorsync:$V"
            echo '```'
          } >> notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V gibt es schon, nur der Text wird aus dem CHANGELOG aktualisiert."
            gh release edit "v$V" --notes-file notes.md
          else
            git archive --format=zip --prefix=mirrorsync/ -o "mirrorsync-$V.zip" HEAD
            gh release create "v$V" "mirrorsync-$V.zip" \
              --target "$GITHUB_SHA" --title "MirrorSync $V" --notes-file notes.md --latest
          fi
