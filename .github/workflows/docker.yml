name: Image and release

# Builds the image and pushes it to the GitHub Container Registry:
#   ghcr.io/dermilderjoghurt/mirrorsync:latest       (every push to main)
#   ghcr.io/dermilderjoghurt/mirrorsync:<version>    (version from app/VERSION, e.g. 1.33.2)
#   ghcr.io/dermilderjoghurt/mirrorsync:1.33         (minor version, always the newest 1.33.x)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create tag and release
  packages: write   # push image to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from app/VERSION
        id: ver
        run: |
          v=$(tr -d ' \n\r' < app/VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dermilderjoghurt/mirrorsync
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.minor }}
          labels: |
            org.opencontainers.image.title=MirrorSync
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Vulnerability scan of the freshly built image with Trivy. Results appear under Security → Code scanning
  # and in the job log. Does not block the release; new findings show up there and as Dependabot PRs.
  scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from app/VERSION
        id: ver
        run: echo "version=$(tr -d ' \n\r' < app/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/dermilderjoghurt/mirrorsync:${{ steps.ver.outputs.version }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Trivy summary (table in the log)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/dermilderjoghurt/mirrorsync:${{ steps.ver.outputs.version }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-setup-trivy: true

  # Android app (android/), see android.yml. The release job attaches the APK.
  android:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/android.yml
    secrets: inherit

  # On a new version in app/VERSION, automatically creates tag vX.Y.Z and a GitHub release
  # (text from the matching CHANGELOG section, ZIP of the repo and the signed Android APK attached).
  release:
    needs: [build, android]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mirrorsync-apk
          path: apk

      - name: Create release or update its text
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(tr -d ' \n\r' < app/VERSION)
          # CHANGELOG section "## <version> – date" up to the next "## " line
          awk -v v="$V" '
            /^## / { if (p) exit; if (index($0, "## " v " ") == 1) { p = 1; next } }
            p' CHANGELOG.md > notes.md
          {
            echo
            echo "### Docker"
            echo '```'
            echo "docker pull ghcr.io/dermilderjoghurt/mirrorsync:$V"
            echo '```'
          } >> notes.md
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists, only updating its text from the CHANGELOG."
            gh release edit "v$V" --notes-file notes.md
          else
            git archive --format=zip --prefix=mirrorsync/ -o "mirrorsync-$V.zip" HEAD
            gh release create "v$V" "mirrorsync-$V.zip" \
              --target "$GITHUB_SHA" --title "MirrorSync $V" --notes-file notes.md --latest
          fi
          # signed APK only (an unsigned one cannot be installed)
          if [ -f "apk/mirrorsync-$V.apk" ]; then
            gh release upload "v$V" "apk/mirrorsync-$V.apk" --clobber
          fi
