name: Hourly security scan

# Scans the published image ghcr.io/dermilderjoghurt/mirrorsync:latest once an hour with Trivy,
# so vulnerabilities found after a release also show up under Security → Code scanning.
on:
  schedule:
    - cron: "17 * * * *"   # every hour at minute 17 (UTC)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/dermilderjoghurt/mirrorsync:latest
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy.sarif
          category: trivy-image
