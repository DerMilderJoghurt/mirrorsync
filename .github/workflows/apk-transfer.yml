name: APK transfer (temporary)

# Temporary helper: builds the unsigned APK and commits it to this branch so it can be signed outside GitHub.
# Removed again before merging.
on:
  push:
    branches: [claude/project-thread-ngz6co]
    paths: [".github/workflows/apk-transfer.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - run: |
          mkdir -p apk-transfer
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk apk-transfer/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-transfer
          git commit -m "APK transfer [skip ci]"
          git push
